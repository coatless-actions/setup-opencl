name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '40 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Rapid pushes to a pull request or feature branch should not queue up
# multiple 10+-leg matrices behind each other -- only the newest push's run
# is worth waiting for. The default branch is excluded from cancellation:
# a push there can land between a scheduled run and a workflow_dispatch run,
# and neither of those should be cut short by the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: ${{ matrix.runtime }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Tier 1: generally available runner labels. These must stay green.
          # 'expect' is an assertion, not a floor: ">=1" for runtimes that must
          # produce a device, "=0" for headers-only. A ">=0" form is deliberately
          # absent -- device-count is unsigned, so it would assert nothing.
          - { os: ubuntu-24.04,      runtime: auto, verify: 'true',  require-fp64: 'false', expect: '>=1' }
          - { os: ubuntu-24.04-arm,  runtime: auto, verify: 'true',  require-fp64: 'false', expect: '>=1' }
          - { os: macos-latest,      runtime: auto, verify: 'true',  require-fp64: 'false', expect: '>=1' }
          # Headers and loader only. A device appearing here is a real failure:
          # it means the runtime was installed when it should not have been.
          - { os: ubuntu-24.04,      runtime: none, verify: 'true',  require-fp64: 'false', expect: '=0' }
          - { os: macos-latest,      runtime: none, verify: 'true',  require-fp64: 'false', expect: '=0' }
          # Confirmed in CI (not reproducible on bare-metal Apple Silicon,
          # which reports one device): Apple's OpenCL.framework enumerates a
          # platform but returns zero devices on hosted Apple Silicon
          # runners. 'verify: false' reflects what a real caller of
          # 'runtime: apple' must also set here, since the action's own
          # default 'verify: true' would otherwise fail the job on the
          # expected zero-device count.
          - { os: macos-latest,      runtime: apple, verify: 'false', require-fp64: 'false', expect: '=0' }
          # require-fp64 has no coverage otherwise: no leg above sets it, so
          # this public input has never executed in either direction.
          # ubuntu-24.04's PoCL reports fp64=true, so this leg proves the
          # input reaches the action and does not fire a false positive.
          - { os: ubuntu-24.04,      runtime: auto, verify: 'true',  require-fp64: 'true',  expect: '>=1' }
          # Windows has never had an fp64 assertion of its own -- it was only
          # proven transitively via the ubuntu-24.04 leg above. windows-2025
          # reports fp64=true (Intel's CPU runtime), so this proves the
          # input reaches the action on Windows too.
          - { os: windows-2025,      runtime: auto, verify: 'true',  require-fp64: 'true',  expect: '>=1' }
          - { os: windows-2022,      runtime: auto, verify: 'true',  require-fp64: 'false', expect: '>=1' }
          - { os: windows-2025,      runtime: none, verify: 'true',  require-fp64: 'false', expect: '=0' }
          # cache has no coverage otherwise: every leg above either omits it
          # (implicit default 'true') or would need it to be 'true' to
          # verify a device. runtime: none keeps this cheap -- it downloads
          # only the ~1 MB SDK, not the ~110 MB runtime archive -- while
          # still exercising the 'cache: false' branch of the action's own
          # `if: ... && inputs.cache == 'true'` gate on the restore step.
          - { os: windows-2022,      runtime: none, verify: 'true',  require-fp64: 'false', cache: 'false', expect: '=0' }

    steps:
      - name: Checkout the action
        uses: actions/checkout@v6

      - name: Set up OpenCL
        id: setup
        uses: ./
        with:
          runtime: ${{ matrix.runtime }}
          verify: ${{ matrix.verify }}
          require-fp64: ${{ matrix.require-fp64 }}
          # Most legs don't set matrix.cache, which makes this an empty
          # string -- '' || 'true' falls back to the action's own default.
          # A leg that does set matrix.cache (a non-empty string, including
          # the literal 'false') is truthy in Actions' `||` and passes
          # through unchanged.
          cache: ${{ matrix.cache || 'true' }}

      - name: Confirm the action reported a device
        shell: bash
        env:
          SE_EXPECT: ${{ matrix.expect }}
          SE_DEVICE_COUNT: ${{ steps.setup.outputs.device-count }}
          SE_DEVICE_NAME: ${{ steps.setup.outputs.device-name }}
          SE_PLATFORM_VERSION: ${{ steps.setup.outputs.platform-version }}
          SE_FP64: ${{ steps.setup.outputs.fp64 }}
          SE_RUNTIME_NAME: ${{ steps.setup.outputs.runtime-name }}
        run: |
          set -euo pipefail

          echo "runtime-name    = ${SE_RUNTIME_NAME}"
          echo "device-count    = ${SE_DEVICE_COUNT}"
          echo "device-name     = ${SE_DEVICE_NAME}"
          echo "platform-version= ${SE_PLATFORM_VERSION}"
          echo "fp64            = ${SE_FP64}"

          if [ -z "${SE_DEVICE_COUNT}" ]; then
            echo "::error::The action produced no device-count output"
            exit 1
          fi

          case "${SE_EXPECT}" in
            '>='*)
              want="${SE_EXPECT#>=}"
              if [ "${SE_DEVICE_COUNT}" -lt "${want}" ]; then
                echo "::error::Expected at least ${want} device(s), got ${SE_DEVICE_COUNT}"
                exit 1
              fi
              ;;
            '='*)
              want="${SE_EXPECT#=}"
              if [ "${SE_DEVICE_COUNT}" -ne "${want}" ]; then
                echo "::error::Expected exactly ${want} device(s), got ${SE_DEVICE_COUNT}"
                exit 1
              fi
              ;;
            *)
              echo "::error::Malformed expectation '${SE_EXPECT}'; use '>=N' or '=N'"
              exit 1
              ;;
          esac

      # Compiles against the exported environment only, with no reference to
      # the action's internals. This is the contract consumers depend on.
      - name: Build a consumer program using only the exported environment
        shell: bash
        run: |
          set -euo pipefail

          cat > consumer.c <<'PROGRAM'
          #define CL_TARGET_OPENCL_VERSION 300
          #include <stdio.h>
          #include <CL/cl.h>
          int main(void) {
              cl_uint n = 0;
              cl_int status = clGetPlatformIDs(0, NULL, &n);
              printf("status=%d platforms=%u\n", status, n);
              return 0;
          }
          PROGRAM
          cc -o consumer consumer.c ${OPENCL_CPPFLAGS} ${OPENCL_LIBS}
          ./consumer

  # Tier 2: public-preview and deprecated runner labels, plus the floating
  # *-latest labels. These have no SLA and change without notice, so they run
  # on the schedule only and are never allowed to fail a pull request. The
  # cron is what catches ubuntu-latest rolling forward to 26.04, where PoCL's
  # LLVM dependency changes underneath the action.
  preview:
    name: ${{ matrix.runtime }} on ${{ matrix.os }} (preview)
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04,      runtime: auto, expect: '>=1' }
          - { os: ubuntu-26.04-arm,  runtime: auto, expect: '>=1' }
          - { os: ubuntu-22.04,      runtime: auto, expect: '>=1' }
          - { os: macos-15-intel,    runtime: auto, expect: '>=1' }
          - { os: ubuntu-latest,     runtime: auto, expect: '>=1' }
          - { os: macos-latest,      runtime: auto, expect: '>=1' }
          - { os: windows-latest,    runtime: auto, expect: '>=1' }
          # version has no coverage otherwise: the demo legs that originally
          # proved the asset-resolution path were removed once it was known
          # to work, which left it untested again. Pinning a known-older
          # intel/llvm tag here keeps that resolution path exercised without
          # adding a Tier-1 Windows download -- version is honored only for
          # runtime intel on Windows, and this is a second full ~110 MB
          # runtime download alongside the two already in Tier-1.
          - { os: windows-2025,      runtime: intel, version: '2026-WW22', expect: '>=1' }

    steps:
      - name: Checkout the action
        uses: actions/checkout@v6

      - name: Set up OpenCL
        id: setup
        uses: ./
        with:
          runtime: ${{ matrix.runtime }}
          version: ${{ matrix.version }}

      # Mirrors the Tier-1 assertion exactly (see "Confirm the action
      # reported a device" above): both need set -euo pipefail and both
      # expectation forms, or a 'runtime: none' preview leg would silently
      # misbehave and a malformed expectation would pass unnoticed.
      - name: Confirm the action reported a device (preview)
        shell: bash
        env:
          SE_EXPECT: ${{ matrix.expect }}
          SE_DEVICE_COUNT: ${{ steps.setup.outputs.device-count }}
          SE_DEVICE_NAME: ${{ steps.setup.outputs.device-name }}
          SE_PLATFORM_VERSION: ${{ steps.setup.outputs.platform-version }}
          SE_FP64: ${{ steps.setup.outputs.fp64 }}
          SE_RUNTIME_NAME: ${{ steps.setup.outputs.runtime-name }}
        run: |
          set -euo pipefail

          echo "runtime-name    = ${SE_RUNTIME_NAME}"
          echo "device-count    = ${SE_DEVICE_COUNT}"
          echo "device-name     = ${SE_DEVICE_NAME}"
          echo "platform-version= ${SE_PLATFORM_VERSION}"
          echo "fp64            = ${SE_FP64}"

          if [ -z "${SE_DEVICE_COUNT}" ]; then
            echo "::error::The action produced no device-count output"
            exit 1
          fi

          case "${SE_EXPECT}" in
            '>='*)
              want="${SE_EXPECT#>=}"
              if [ "${SE_DEVICE_COUNT}" -lt "${want}" ]; then
                echo "::error::Expected at least ${want} device(s), got ${SE_DEVICE_COUNT}"
                exit 1
              fi
              ;;
            '='*)
              want="${SE_EXPECT#=}"
              if [ "${SE_DEVICE_COUNT}" -ne "${want}" ]; then
                echo "::error::Expected exactly ${want} device(s), got ${SE_DEVICE_COUNT}"
                exit 1
              fi
              ;;
            *)
              echo "::error::Malformed expectation '${SE_EXPECT}'; use '>=N' or '=N'"
              exit 1
              ;;
          esac

  # The action validates and rejects four combinations, but until now none
  # of the four had ever actually been exercised in CI: an unknown
  # 'runtime', 'pocl'/'apple' on Windows, 'intel' on Linux/macOS, and
  # Windows on ARM64. Each leg below passes exactly one invalid input and
  # otherwise-valid ones, so the resolve step in action.yml can only reach
  # this leg's specific validation branch -- no other branch is reachable
  # given the rest of the inputs are valid. That single-variable isolation
  # is what "confirm it failed for the right reason" rests on here, since
  # steps.<id>.outcome alone can only say *that* the action failed, not
  # *why*. Every leg is cheap: the resolve step is the first step of the
  # composite and runs no download or install, so a leg here fails in
  # seconds even on the ARM64 Windows runner.
  reject:
    name: reject ${{ matrix.reason }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,   reason: unknown-runtime,   runtime: bogus }
          - { os: windows-2022,   reason: pocl-on-windows,   runtime: pocl }
          - { os: windows-2022,   reason: apple-on-windows,  runtime: apple }
          - { os: ubuntu-24.04,   reason: intel-on-linux,    runtime: intel }
          - { os: macos-latest,   reason: intel-on-macos,    runtime: intel }
          - { os: windows-11-arm, reason: windows-arm64,     runtime: auto }

    steps:
      - name: Checkout the action
        uses: actions/checkout@v6

      - name: Attempt setup with an invalid combination
        id: attempt
        continue-on-error: true
        uses: ./
        with:
          runtime: ${{ matrix.runtime }}

      - name: Confirm the action rejected this combination
        shell: bash
        env:
          SE_OUTCOME: ${{ steps.attempt.outcome }}
          SE_REASON: ${{ matrix.reason }}
          SE_RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          if [ "${SE_OUTCOME}" != "failure" ]; then
            echo "::error::Expected the action to reject '${SE_REASON}' (runtime=${SE_RUNTIME} on ${{ matrix.os }}), but it succeeded"
            exit 1
          fi
          echo "Correctly rejected: ${SE_REASON} (runtime=${SE_RUNTIME} on ${{ matrix.os }})"

  # The README promises a caller's own explicit setting of any exported
  # variable always wins over the action's export. This is the only leg
  # that exercises that guarantee. It sets OpenCL_ROOT at job level -- a
  # variable the action exports but never itself consumes -- rather than
  # OPENCL_LIBS: the action's own probe step compiles and links against
  # OPENCL_LIBS, so a sentinel there can't tell "set_env correctly skipped
  # the export" apart from "the action never reached set_env at all", and
  # would need continue-on-error to survive its own probe failing on a
  # non-functional sentinel. OpenCL_ROOT has none of that: the action runs
  # to completion normally, so the assertion below genuinely depends on
  # set_env having deferred to the caller's value, not on how far the
  # action got before dying. runtime: none and verify: false just keep the
  # run fast and independent of any real toolchain.
  env-idempotency:
    name: a caller's OpenCL_ROOT wins over the action's export
    runs-on: ubuntu-24.04
    env:
      OpenCL_ROOT: sentinel-value

    steps:
      - name: Checkout the action
        uses: actions/checkout@v6

      - name: Set up OpenCL
        uses: ./
        with:
          runtime: none
          verify: 'false'

      - name: Confirm the caller's OpenCL_ROOT was not overwritten
        shell: bash
        run: |
          set -euo pipefail
          if [ "${OpenCL_ROOT}" != "sentinel-value" ]; then
            echo "::error::Expected OpenCL_ROOT to remain 'sentinel-value' (the caller's own job-level setting), got '${OpenCL_ROOT}'"
            exit 1
          fi
          echo "OpenCL_ROOT correctly preserved the caller's own value: ${OpenCL_ROOT}"
