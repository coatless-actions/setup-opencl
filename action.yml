name: 'Setup OpenCL'
description: 'Install OpenCL headers, an ICD loader, and a working CPU device on GitHub-hosted runners'
author: 'James J. Balamuta'

branding:
  icon: 'cpu'
  color: 'blue'

inputs:
  runtime:
    description: 'OpenCL runtime to install: pocl, intel, apple, none, or auto (default: derived from runner.os)'
    required: false
    default: 'auto'
  version:
    description: 'Pin the runtime version. Only honored for runtime "intel" on Windows; ignored with a warning elsewhere (default: the tested version for this runner)'
    required: false
    default: ''
  verify:
    description: 'Fail the job when no OpenCL device is found ("true" or "false"). Never fatal when runtime is "none"'
    required: false
    default: 'true'
  require-fp64:
    description: 'Also fail when the device does not support double precision ("true" or "false")'
    required: false
    default: 'false'
  cache:
    description: 'Cache downloads and package archives ("true" or "false"). A no-op on runners with nothing worth caching'
    required: false
    default: 'true'

outputs:
  opencl-root:
    description: 'Root directory of the installed OpenCL SDK'
    value: ${{ steps.collect.outputs.opencl-root }}
  opencl-include-dir:
    description: 'Directory containing CL/cl.h'
    value: ${{ steps.collect.outputs.opencl-include-dir }}
  opencl-library:
    description: 'Full path to the ICD loader library'
    value: ${{ steps.collect.outputs.opencl-library }}
  icd-vendors-path:
    description: 'Directory or file the ICD loader was pointed at'
    value: ${{ steps.collect.outputs.icd-vendors-path }}
  runtime-name:
    description: 'Runtime actually installed: pocl, intel-cpu, apple, or none'
    value: ${{ steps.collect.outputs.runtime-name }}
  platform-version:
    description: 'CL_PLATFORM_VERSION of the platform providing the first device'
    value: ${{ steps.probe.outputs.platform-version }}
  device-name:
    description: 'CL_DEVICE_NAME of the first device found'
    value: ${{ steps.probe.outputs.device-name }}
  device-count:
    description: 'Number of OpenCL devices found. Zero is a valid value, not an error signal'
    value: ${{ steps.probe.outputs.device-count }}
  fp64:
    description: 'Whether the first device reports double-precision support ("true" or "false")'
    value: ${{ steps.probe.outputs.fp64 }}

runs:
  using: 'composite'
  steps:
    # The runner does not enforce input contracts (actions/runner#1070) and
    # inputs have no type (actions/runner#2238), so validate by hand.
    - name: Validate inputs and resolve the runtime
      id: resolve
      shell: bash
      env:
        SE_RUNTIME: ${{ inputs.runtime }}
        SE_VERSION: ${{ inputs.version }}
        SE_VERIFY: ${{ inputs.verify }}
        SE_REQUIRE_FP64: ${{ inputs.require-fp64 }}
        SE_OS: ${{ runner.os }}
        SE_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail

        case "${SE_RUNTIME}" in
          auto|pocl|intel|apple|none) ;;
          *)
            echo "::error::Unknown runtime '${SE_RUNTIME}'"
            echo "Valid values are: auto, pocl, intel, apple, none."
            exit 1
            ;;
        esac

        for name in SE_VERIFY SE_REQUIRE_FP64; do
          value="${!name}"
          if [ "${value}" != "true" ] && [ "${value}" != "false" ]; then
            echo "::error::Input ${name#SE_} must be \"true\" or \"false\", got '${value}'"
            exit 1
          fi
        done

        if [ "${SE_OS}" = "Windows" ] && [ "${SE_ARCH}" = "ARM64" ]; then
          echo "::error::No OpenCL CPU runtime exists for Windows on ARM64"
          echo "Intel's oclcpuexp is x86-64 only, conda-forge's PoCL is win-64 only, and MSYS2 has no PoCL. Use an x64 Windows runner."
          exit 1
        fi

        resolved="${SE_RUNTIME}"
        if [ "${resolved}" = "auto" ]; then
          case "${SE_OS}" in
            Linux|macOS) resolved="pocl" ;;
            Windows)     resolved="intel" ;;
            *)
              echo "::error::Unsupported runner OS '${SE_OS}'"
              echo "This action supports Linux, macOS, and Windows."
              exit 1
              ;;
          esac
        fi

        if [ -n "${SE_VERSION}" ] && [ "${resolved}" != "intel" ]; then
          echo "::warning::The 'version' input is only honored for runtime 'intel' on Windows; ignoring it for runtime '${resolved}'"
        fi

        echo "resolved-runtime=${resolved}" >> "$GITHUB_OUTPUT"

        # The env context excludes variables inherited by the runner process,
        # so ${{ env.ImageVersion }} expands to the empty string and would
        # silently produce a cache key that never invalidates. Export it here.
        echo "IMAGE_OS_VERSION=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_ENV"

    # Only Windows has a download large enough to be worth caching: the
    # oclcpuexp archive is roughly 110 MB. Linux apt archives and macOS
    # bottles are fast enough that caching them is not yet justified.
    - name: Restore the OpenCL runtime cache
      if: runner.os == 'Windows' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}\opencl
        key: opencl-${{ runner.os }}-${{ runner.arch }}-${{ env.IMAGE_OS_VERSION }}-${{ steps.resolve.outputs.resolved-runtime }}-${{ inputs.version }}

    - name: Install OpenCL
      id: install
      if: runner.os != 'Windows'
      shell: bash
      env:
        SE_RUNTIME: ${{ steps.resolve.outputs.resolved-runtime }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}" in
          Linux) script="install-linux.sh" ;;
          macOS) script="install-macos.sh" ;;
          *)
            echo "::error::No install script for runner OS '${RUNNER_OS}'"
            exit 1
            ;;
        esac
        # The install scripts also print package-manager chatter (apt-get,
        # brew) to stdout alongside their key=value contract, so only lines
        # that look like a well-formed key=value pair are safe to forward to
        # GITHUB_OUTPUT. This pattern -- rather than a fixed list of key
        # names -- is what lets a future install script add new keys without
        # them being silently dropped here.
        output="$(bash "${GITHUB_ACTION_PATH}/scripts/${script}")"
        printf '%s\n' "${output}"
        printf '%s\n' "${output}" | grep -E \
          '^[a-z][a-z0-9-]*=' \
          >> "$GITHUB_OUTPUT"

    - name: Install OpenCL (Windows)
      id: install-windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SE_RUNTIME: ${{ steps.resolve.outputs.resolved-runtime }}
        SE_VERSION: ${{ inputs.version }}
        # Only used when 'version' is set, to resolve the release's asset
        # name without hitting the GitHub API's anonymous rate limit.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        & "$env:GITHUB_ACTION_PATH\scripts\install-windows.ps1" |
          Tee-Object -FilePath $env:GITHUB_OUTPUT -Append

    - name: Register the vendor ICD (Windows)
      if: runner.os == 'Windows' && steps.install-windows.outputs.runtime-name != 'none'
      shell: pwsh
      run: |
        & "$env:GITHUB_ACTION_PATH\scripts\register-icd.ps1" `
            -IcdPath "${{ steps.install-windows.outputs.icd-filenames }}"

    # Merges the per-OS install outputs into one canonical set. This is a shell
    # step, not a ${{ a || b }} expression, because Actions' || is truthiness
    # based: 'false' and '0' are falsy, so a legitimate zero or false would be
    # discarded rather than passed through.
    - name: Collect install results
      id: collect
      shell: bash
      env:
        SE_NIX_ROOT: ${{ steps.install.outputs.opencl-root }}
        SE_WIN_ROOT: ${{ steps.install-windows.outputs.opencl-root }}
        SE_NIX_INCLUDE: ${{ steps.install.outputs.opencl-include-dir }}
        SE_WIN_INCLUDE: ${{ steps.install-windows.outputs.opencl-include-dir }}
        SE_NIX_LIBRARY: ${{ steps.install.outputs.opencl-library }}
        SE_WIN_LIBRARY: ${{ steps.install-windows.outputs.opencl-library }}
        SE_NIX_CPPFLAGS: ${{ steps.install.outputs.opencl-cppflags }}
        SE_WIN_CPPFLAGS: ${{ steps.install-windows.outputs.opencl-cppflags }}
        SE_NIX_LIBS: ${{ steps.install.outputs.opencl-libs }}
        SE_WIN_LIBS: ${{ steps.install-windows.outputs.opencl-libs }}
        SE_NIX_ICD: ${{ steps.install.outputs.icd-vendors-path }}
        SE_WIN_ICD: ${{ steps.install-windows.outputs.icd-vendors-path }}
        SE_NIX_RUNTIME_NAME: ${{ steps.install.outputs.runtime-name }}
        SE_WIN_RUNTIME_NAME: ${{ steps.install-windows.outputs.runtime-name }}
      run: |
        set -euo pipefail

        # Exactly one of the two install steps ran, so the other's outputs are
        # unset. Pick by which side actually produced a runtime-name.
        if [ "${RUNNER_OS}" = "Windows" ]; then side="WIN"; else side="NIX"; fi

        # Map each short internal key to the kebab-case name the outputs:
        # block declares, so steps.collect.outputs.* uses the same names
        # every other step already reads.
        for pair in ROOT:opencl-root INCLUDE:opencl-include-dir \
                    LIBRARY:opencl-library CPPFLAGS:opencl-cppflags \
                    LIBS:opencl-libs ICD:icd-vendors-path \
                    RUNTIME_NAME:runtime-name; do
          key="${pair%%:*}"
          outname="${pair#*:}"
          var="SE_${side}_${key}"
          printf '%s=%s\n' "${outname}" "${!var-}"
        done >> "$GITHUB_OUTPUT"

    - name: Export the OpenCL environment
      shell: bash
      env:
        SE_CPPFLAGS: ${{ steps.collect.outputs.opencl-cppflags }}
        SE_LIBS: ${{ steps.collect.outputs.opencl-libs }}
        SE_ROOT: ${{ steps.collect.outputs.opencl-root }}
        SE_LIBRARY: ${{ steps.collect.outputs.opencl-library }}
        SE_INCLUDE_DIR: ${{ steps.collect.outputs.opencl-include-dir }}
        SE_ICD_VENDORS: ${{ steps.collect.outputs.icd-vendors-path }}
        SE_SDKROOT: ${{ steps.install.outputs.sdkroot }}
        SE_ICD_FILENAMES: ${{ steps.install-windows.outputs.icd-filenames }}
        SE_LOADER_BIN_DIR: ${{ steps.install-windows.outputs.loader-bin-dir }}
      run: |
        set -euo pipefail

        # Idempotent: a caller's explicit setting always wins.
        set_env() {
          if [ -z "${!1+set}" ]; then
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"
          fi
        }

        # OCL_ICD_FILENAMES is a Khronos-loader variable and is consulted
        # before the registry. On Linux it does nothing -- ocl-icd added it
        # only in 2.3.5, and no Ubuntu release through 26.04 ships that.
        if [ "${RUNNER_OS}" = "Windows" ] && [ -n "${SE_ICD_FILENAMES:-}" ]; then
          set_env OCL_ICD_FILENAMES "${SE_ICD_FILENAMES}"
        fi

        # Exactly one loader directory on PATH. GITHUB_PATH prepends, so
        # adding a second would silently shadow the one the build linked
        # against.
        if [ -n "${SE_LOADER_BIN_DIR:-}" ]; then
          printf '%s\n' "${SE_LOADER_BIN_DIR}" >> "$GITHUB_PATH"
        fi

        # Every install script is responsible for handing back cppflags that
        # already resolve <CL/cl.h> on its own platform (see
        # scripts/install-macos.sh for the Apple-framework special case), so
        # this step stays runtime-agnostic.
        set_env OPENCL_CPPFLAGS   "${SE_CPPFLAGS}"
        set_env OPENCL_LIBS       "${SE_LIBS}"
        set_env OpenCL_ROOT       "${SE_ROOT}"
        set_env OpenCL_LIBRARY    "${SE_LIBRARY}"
        set_env OpenCL_INCLUDE_DIR "${SE_INCLUDE_DIR}"

        if [ "${RUNNER_OS}" != "Windows" ] && [ -n "${SE_ICD_VENDORS}" ]; then
          set_env OCL_ICD_VENDORS "${SE_ICD_VENDORS}"
        fi

        # PoCL's LLVM cannot find system headers without SDKROOT.
        if [ -n "${SE_SDKROOT:-}" ]; then
          set_env SDKROOT "${SE_SDKROOT}"
        fi

    - name: Probe for an OpenCL device (Windows)
      id: verify-windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SE_RESOLVED: ${{ steps.resolve.outputs.resolved-runtime }}
        SE_VERIFY: ${{ inputs.verify }}
        SE_REQUIRE_FP64: ${{ inputs.require-fp64 }}
      run: |
        $ErrorActionPreference = 'Stop'
        $clinfo = Join-Path "${{ steps.install-windows.outputs.loader-bin-dir }}" 'clinfo.exe'

        # clinfo's exit code is unusable: main() tolerates
        # CL_PLATFORM_NOT_FOUND_KHR and unconditionally returns 0. Gate on
        # content, never on status.
        $raw = & $clinfo --raw 2>&1 | Out-String

        $names = [regex]::Matches($raw, 'CL_DEVICE_NAME\s+(.+)')
        $count = $names.Count
        $name  = if ($count -gt 0) { $names[0].Groups[1].Value.Trim() } else { '' }
        $ver   = [regex]::Match($raw, 'CL_PLATFORM_VERSION\s+(.+)')
        $fp64m = [regex]::Match($raw, 'CL_DEVICE_DOUBLE_FP_CONFIG\s+(.+)')
        $fp64  = if ($fp64m.Success -and $fp64m.Groups[1].Value.Trim() -notmatch '^(0|None)$') { 'true' } else { 'false' }

        "device-count=$count"                                            | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
        "device-name=$name"                                              | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
        "platform-version=$(if ($ver.Success) { $ver.Groups[1].Value.Trim() })" | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
        "fp64=$fp64"                                                     | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append

        if ($env:SE_RESOLVED -eq 'none') {
          Write-Output "::notice::Installed headers and loader only; $count device(s) found"
          exit 0
        }
        if ($env:SE_VERIFY -eq 'true' -and $count -eq 0) {
          Write-Output "::error::No OpenCL device found on this runner"
          Write-Output "Set 'runtime' to a specific value, or set 'verify' to 'false' if a device is not required."
          exit 1
        }
        # A zero device count means there is nothing to check fp64 support
        # on, and that is a distinct condition from "found a device that
        # lacks it" -- do not let an explicit 'verify: false' (the correct
        # caller response to a runtime with no device) get overridden by this
        # gate finding a precision problem that was never actually observed.
        # Matches the POSIX probe step's guard exactly.
        if ($count -gt 0 -and $env:SE_REQUIRE_FP64 -eq 'true' -and $fp64 -ne 'true') {
          Write-Output "::error::The OpenCL device does not support double precision"
          Write-Output "Set 'require-fp64' to 'false' if single precision is sufficient."
          exit 1
        }

    - name: Probe for an OpenCL device
      id: verify
      if: runner.os != 'Windows'
      shell: bash
      env:
        SE_RESOLVED: ${{ steps.resolve.outputs.resolved-runtime }}
        SE_VERIFY: ${{ inputs.verify }}
        SE_REQUIRE_FP64: ${{ inputs.require-fp64 }}
      run: |
        set -euo pipefail

        probe_dir="$(mktemp -d)"
        # shellcheck disable=SC2086
        cc -o "${probe_dir}/probe" "${GITHUB_ACTION_PATH}/scripts/probe.c" \
           ${OPENCL_CPPFLAGS} ${OPENCL_LIBS}

        output="$("${probe_dir}/probe")"
        printf '%s\n' "${output}"
        printf '%s\n' "${output}" >> "$GITHUB_OUTPUT"

        count="$(printf '%s\n' "${output}" | sed -n 's/^device-count=//p')"
        fp64="$(printf '%s\n' "${output}" | sed -n 's/^fp64=//p')"

        # `[ "${count}" -eq 0 ]` returns 2 (not 1) on non-numeric input, which
        # inside an `&&` chain in an `if` just makes the condition false --
        # this gate is the action's entire safety story, so fail closed
        # instead of silently passing on a malformed probe result.
        case "${count}" in
          ''|*[!0-9]*)
            echo "::error::Probe produced a non-numeric device-count '${count}'"
            exit 1
            ;;
        esac

        # Requesting a headers-only install and then failing for having no
        # device would be self-contradictory, so verification is never fatal
        # when runtime is "none".
        if [ "${SE_RESOLVED}" = "none" ]; then
          echo "::notice::Installed headers and loader only; ${count} device(s) found"
          exit 0
        fi

        if [ "${SE_VERIFY}" = "true" ] && [ "${count}" -eq 0 ]; then
          echo "::error::No OpenCL device found on this runner"
          echo "Set 'runtime' to a specific value, or set 'verify' to 'false' if a device is not required."
          exit 1
        fi

        # A zero device count means there is nothing to check fp64 support
        # on, and that is a distinct condition from "found a device that
        # lacks it" -- do not let an explicit 'verify: false' (the correct
        # caller response to a runtime with no device) get overridden by this
        # gate finding a precision problem that was never actually observed.
        if [ "${count}" -gt 0 ] && [ "${SE_REQUIRE_FP64}" = "true" ] && [ "${fp64}" != "true" ]; then
          echo "::error::The OpenCL device does not support double precision"
          echo "Set 'require-fp64' to 'false' if single precision is sufficient."
          exit 1
        fi

    # Merges the two probe outputs the same way the install outputs are
    # merged: a shell step, never `||`. device-count is legitimately 0 on
    # every headers-only run and fp64 is legitimately false, and both are
    # falsy to Actions' `||`, so a coalescing expression would blank out
    # exactly the values the `runtime: none` legs exist to assert.
    - name: Collect probe results
      id: probe
      shell: bash
      env:
        SE_NIX_COUNT: ${{ steps.verify.outputs.device-count }}
        SE_WIN_COUNT: ${{ steps.verify-windows.outputs.device-count }}
        SE_NIX_NAME: ${{ steps.verify.outputs.device-name }}
        SE_WIN_NAME: ${{ steps.verify-windows.outputs.device-name }}
        SE_NIX_PLATFORM: ${{ steps.verify.outputs.platform-version }}
        SE_WIN_PLATFORM: ${{ steps.verify-windows.outputs.platform-version }}
        SE_NIX_FP64: ${{ steps.verify.outputs.fp64 }}
        SE_WIN_FP64: ${{ steps.verify-windows.outputs.fp64 }}
      run: |
        set -euo pipefail
        if [ "${RUNNER_OS}" = "Windows" ]; then side="WIN"; else side="NIX"; fi
        {
          printf 'device-count=%s\n'     "$(eval "printf '%s' \"\${SE_${side}_COUNT-}\"")"
          printf 'device-name=%s\n'      "$(eval "printf '%s' \"\${SE_${side}_NAME-}\"")"
          printf 'platform-version=%s\n' "$(eval "printf '%s' \"\${SE_${side}_PLATFORM-}\"")"
          printf 'fp64=%s\n'             "$(eval "printf '%s' \"\${SE_${side}_FP64-}\"")"
        } >> "$GITHUB_OUTPUT"
