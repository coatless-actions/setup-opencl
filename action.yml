name: 'Setup OpenCL'
description: 'Install OpenCL headers, an ICD loader, and a working CPU device on GitHub-hosted runners'
author: 'James J. Balamuta'

branding:
  icon: 'cpu'
  color: 'blue'

inputs:
  runtime:
    description: 'OpenCL runtime to install: pocl, intel, apple, none, or auto (default: derived from runner.os)'
    required: false
    default: 'auto'
  pocl-source:
    description: 'Where PoCL comes from on macOS: homebrew, conda-forge, or auto. Only honored for runtime "pocl" on macOS; ignored with a warning elsewhere. "auto" currently resolves to "homebrew", whose PoCL is built against llvm@21 and miscompiles OpenCL kernels (llvm#161077) -- "conda-forge" installs one built against LLVM 19 instead'
    required: false
    default: 'auto'
  version:
    description: 'Pin the runtime version. Only honored for runtime "intel" on Windows; ignored with a warning elsewhere (default: the tested version for this runner). Verified against the digest the GitHub API reports for that release, not a pinned one, and the job fails if none is published and none is supplied via "version-sha256"'
    required: false
    default: ''
  version-sha256:
    description: 'Expected SHA-256 (64 hex characters) of the pinned release asset selected by "version". Only needed for a release whose asset predates the digest the GitHub API now reports; supply it and the download is verified against this value instead. Must agree with the API digest when both exist. Ignored, with a warning, when "version" is unset'
    required: false
    default: ''
  verify:
    description: 'Fail the job when no OpenCL device is found ("true" or "false"). Never fatal when runtime is "none"'
    required: false
    default: 'true'
  require-fp64:
    description: 'Also fail when the device does not support double precision ("true" or "false")'
    required: false
    default: 'false'
  require-kernel:
    description: 'Also fail when the device cannot actually run a kernel ("true" or "false"). A device that enumerates but cannot compile or execute anything always produces a warning; this makes it fatal'
    required: false
    default: 'false'
  cache:
    description: 'Cache downloads and package archives ("true" or "false"). A no-op on runners with nothing worth caching'
    required: false
    default: 'true'

outputs:
  opencl-root:
    description: 'Root directory of the installed OpenCL SDK'
    value: ${{ steps.collect.outputs.opencl-root }}
  opencl-include-dir:
    description: 'Directory containing CL/cl.h'
    value: ${{ steps.collect.outputs.opencl-include-dir }}
  opencl-library:
    description: 'Full path to the ICD loader library'
    value: ${{ steps.collect.outputs.opencl-library }}
  icd-vendors-path:
    description: 'Loader- and platform-specific vendor path (a file on Linux, a directory on macOS, a vendor DLL path on Windows). Diagnostic; not a portable value. Consumers should use the OCL_ICD_VENDORS / OCL_ICD_FILENAMES environment variables this action already exports instead of wiring this output up themselves -- see the README'
    value: ${{ steps.collect.outputs.icd-vendors-path }}
  runtime-name:
    description: 'Runtime actually installed: pocl, intel-cpu, apple, or none'
    value: ${{ steps.collect.outputs.runtime-name }}
  platform-version:
    description: 'CL_PLATFORM_VERSION of the platform providing the first device'
    value: ${{ steps.probe.outputs.platform-version }}
  device-name:
    description: 'CL_DEVICE_NAME of the first device found'
    value: ${{ steps.probe.outputs.device-name }}
  device-count:
    description: 'Number of OpenCL devices found. Zero is a valid value, not an error signal'
    value: ${{ steps.probe.outputs.device-count }}
  fp64:
    description: 'Whether the first device reports double-precision support ("true" or "false")'
    value: ${{ steps.probe.outputs.fp64 }}
  kernel:
    description: 'Whether the first device actually ran a kernel and returned the right numbers ("true" or "false"). Unlike every other probe output this is measured by executing something, not by asking the device what it claims. False whenever device-count is 0, and false when the round trip could not be run at all'
    value: ${{ steps.probe.outputs.kernel }}

runs:
  using: 'composite'
  steps:
    # The runner does not enforce input contracts (actions/runner#1070) and
    # inputs have no type (actions/runner#2238), so validate by hand.
    - name: Validate inputs and resolve the runtime
      id: resolve
      shell: bash
      env:
        SE_RUNTIME: ${{ inputs.runtime }}
        SE_POCL_SOURCE: ${{ inputs.pocl-source }}
        SE_VERSION: ${{ inputs.version }}
        SE_VERSION_SHA256: ${{ inputs.version-sha256 }}
        SE_VERIFY: ${{ inputs.verify }}
        SE_REQUIRE_FP64: ${{ inputs.require-fp64 }}
        SE_REQUIRE_KERNEL: ${{ inputs.require-kernel }}
        SE_CACHE: ${{ inputs.cache }}
        SE_OS: ${{ runner.os }}
        SE_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail

        case "${SE_RUNTIME}" in
          auto|pocl|intel|apple|none) ;;
          *)
            echo "::error::Unknown runtime '${SE_RUNTIME}'"
            echo "Valid values are: auto, pocl, intel, apple, none."
            exit 1
            ;;
        esac

        case "${SE_POCL_SOURCE}" in
          auto|homebrew|conda-forge) ;;
          *)
            echo "::error::Unknown pocl-source '${SE_POCL_SOURCE}'"
            echo "Valid values are: auto, homebrew, conda-forge."
            exit 1
            ;;
        esac

        for name in SE_VERIFY SE_REQUIRE_FP64 SE_REQUIRE_KERNEL SE_CACHE; do
          value="${!name}"
          if [ "${value}" != "true" ] && [ "${value}" != "false" ]; then
            echo "::error::Input ${name#SE_} must be \"true\" or \"false\", got '${value}'"
            exit 1
          fi
        done

        # The POSIX probe step compiles probe.c unconditionally, even for a
        # headers-only 'runtime: none' with 'verify: false', so a C compiler
        # is a hard dependency on Linux and macOS regardless of inputs.
        # Windows needs no compiler at all -- it verifies via clinfo.exe --
        # so this check is scoped to the two OSes that actually need one.
        # Checked here, in the first step of the composite, rather than in
        # the probe step itself: this step runs before any install, so a
        # container without a compiler fails in seconds instead of paying
        # for a full apt-get install of PoCL and LLVM first, only to hit the
        # same bare "cc: command not found" minutes later.
        if [ "${SE_OS}" != "Windows" ] && ! command -v cc >/dev/null 2>&1; then
          echo "::error::No C compiler ('cc') found on PATH"
          echo "Install one before this step: 'build-essential' on Debian-family Linux (e.g. inside a 'container:' job, 'apt-get install -y build-essential'), or the Xcode Command Line Tools on macOS ('xcode-select --install')."
          exit 1
        fi

        if [ "${SE_OS}" = "Windows" ] && [ "${SE_ARCH}" = "ARM64" ]; then
          echo "::error::No OpenCL CPU runtime exists for Windows on ARM64"
          echo "Intel's oclcpuexp is x86-64 only, conda-forge's PoCL is win-64 only, and MSYS2 has no PoCL. Use an x64 Windows runner."
          exit 1
        fi

        resolved="${SE_RUNTIME}"
        if [ "${resolved}" = "auto" ]; then
          case "${SE_OS}" in
            Linux|macOS) resolved="pocl" ;;
            Windows)     resolved="intel" ;;
            *)
              echo "::error::Unsupported runner OS '${SE_OS}'"
              echo "This action supports Linux, macOS, and Windows."
              exit 1
              ;;
          esac
        fi

        # Runtime availability is OS-specific: Windows has no pocl or apple
        # runtime, and intel's CPU runtime is Windows-only. Validate the
        # resolved value (never the raw 'auto') so this catches both an
        # explicit mismatched runtime and an auto-resolved one alike.
        case "${SE_OS}" in
          Windows)
            case "${resolved}" in
              pocl|apple)
                echo "::error::Runtime '${resolved}' is not available on Windows"
                echo "Windows supports only 'intel' or 'none'. Choose one of those, or leave 'runtime' as 'auto'."
                exit 1
                ;;
            esac
            ;;
          Linux|macOS)
            if [ "${resolved}" = "intel" ]; then
              echo "::error::Runtime 'intel' is not available on ${SE_OS}"
              echo "Intel's CPU runtime is installed only on Windows in this action. Choose 'pocl' (or 'apple' on macOS), or leave 'runtime' as 'auto'."
              exit 1
            fi
            ;;
        esac

        if [ -n "${SE_VERSION}" ] && [ "${resolved}" != "intel" ]; then
          echo "::warning::The 'version' input is only honored for runtime 'intel' on Windows; ignoring it for runtime '${resolved}'"
        fi

        # version-sha256 is the expected digest *of the asset that 'version'
        # selects*, so without a version there is no asset for it to describe
        # -- the pinned default carries its own digest in install-windows.ps1
        # and this input can neither replace nor override it.
        if [ -n "${SE_VERSION_SHA256}" ]; then
          if [ -z "${SE_VERSION}" ]; then
            echo "::warning::The 'version-sha256' input describes the asset that 'version' selects; ignoring it because 'version' is unset. The pinned default runtime is verified against a digest fixed in this action's own source."
          elif [ "${resolved}" != "intel" ]; then
            echo "::warning::The 'version-sha256' input is only honored for runtime 'intel' on Windows; ignoring it for runtime '${resolved}'"
          fi

          # Checked here, in the first step, rather than where it is used: a
          # typo in a 64-character hex string is easy to make and would
          # otherwise surface only after the ~110 MB runtime archive had
          # already been downloaded. install-windows.ps1 validates it again
          # for its own sake -- it is runnable outside this action.
          if ! printf '%s' "${SE_VERSION_SHA256}" | grep -Eqi '^[0-9a-f]{64}$'; then
            echo "::error::Input version-sha256 must be a 64-character hex SHA-256 digest"
            echo "Got '${SE_VERSION_SHA256}'. Obtain the value with 'sha256sum <asset>' (or 'Get-FileHash -Algorithm SHA256') on a copy of the release asset you have verified out of band, and pass the bare hex digest with no 'sha256:' prefix."
            exit 1
          fi
        fi

        # 'pocl-source' selects where macOS gets PoCL from, and is scoped to
        # macOS with runtime pocl: Linux gets PoCL from apt, Windows has no
        # PoCL at all, and 'apple'/'none' install no runtime for it to choose
        # a source for. Everywhere else it is ignored with a warning rather
        # than rejected -- the same treatment 'version' gets outside runtime
        # intel, and for the same reason: one matrix value has to stay usable
        # across every leg of a multi-OS job.
        pocl_source=""
        if [ "${SE_OS}" = "macOS" ] && [ "${resolved}" = "pocl" ]; then
          pocl_source="${SE_POCL_SOURCE}"

          # PROVISIONAL, and deliberately so. 'auto' resolves to 'homebrew'
          # purely to leave the behaviour of every existing v1 consumer
          # unchanged by this input's arrival. conda-forge is the path known
          # to produce a PoCL that can actually run kernels on Apple silicon,
          # and it is expected to become what 'auto' means -- but that was
          # measured on developer hardware with a full Xcode and twelve
          # cores, and it has never run on a hosted macOS runner, which has
          # neither. It becomes the default once this action's own nightly
          # macOS legs have proven it there, not before.
          if [ "${pocl_source}" = "auto" ]; then
            pocl_source="homebrew"
          fi
        elif [ "${SE_POCL_SOURCE}" != "auto" ]; then
          echo "::warning::The 'pocl-source' input is only honored for runtime 'pocl' on macOS; ignoring it on ${SE_OS} for runtime '${resolved}'"
        fi

        # Fires even though homebrew is what 'auto' currently resolves to.
        # Shipping a known-broken dependency quietly is the thing this action
        # exists not to do -- the same reasoning as the unconditional warning
        # the probe steps emit for a device that enumerates but cannot run a
        # kernel, which is exactly the failure this one predicts.
        if [ "${pocl_source}" = "homebrew" ]; then
          echo "::warning::Homebrew's PoCL is built against llvm@21, whose Clang miscompiles the kernel stubs it generates for OpenCL (llvm#161077 -- fixed in LLVM 22, never backported to 21.1.8). Kernels can segfault at runtime on a device that enumerates as perfectly healthy. Set 'pocl-source: conda-forge' to install a PoCL built against LLVM 19 instead. The install step logs the LLVM version actually linked."
        fi

        echo "resolved-runtime=${resolved}" >> "$GITHUB_OUTPUT"
        echo "resolved-pocl-source=${pocl_source}" >> "$GITHUB_OUTPUT"

        # The env context excludes variables inherited by the runner process,
        # so ${{ env.ImageVersion }} expands to the empty string and would
        # silently produce a cache key that never invalidates. Compute it
        # here and expose it as a step output -- like script-hash below --
        # rather than writing it to GITHUB_ENV, which would push it into the
        # caller's job environment as an undocumented side effect and, on a
        # caller-set variable of the same name, clobber it outright, breaking
        # the "a caller's explicit setting always wins" contract this action
        # documents. Its only consumer is the cache key just below.
        echo "image-os-version=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

        # Each cache key must invalidate whenever the pins inside the install
        # script it caches the work of change -- the SDK and runtime versions
        # in install-windows.ps1, the pocl and micromamba versions in
        # install-macos-conda.sh -- or a cache hit would keep serving the old
        # artifact after those pins were bumped. hashFiles() only sees files
        # under github.workspace (the caller's checkout), never
        # github.action_path (this action's own checkout), so the hashes are
        # computed here and exposed as outputs instead. Portable across the
        # three runner OSes' bash: sha256sum (Linux, and present in Git for
        # Windows), shasum (macOS, which has no sha256sum by default), then
        # cksum as a last-resort fallback that is virtually universal -- a key
        # only needs to change when the file does, not to be
        # cryptographically strong.
        hash_file() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | cut -d' ' -f1
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$1" | cut -d' ' -f1
          else
            cksum "$1" | cut -d' ' -f1
          fi
        }
        echo "script-hash=$(hash_file "${GITHUB_ACTION_PATH}/scripts/install-windows.ps1")" >> "$GITHUB_OUTPUT"
        echo "conda-script-hash=$(hash_file "${GITHUB_ACTION_PATH}/scripts/install-macos-conda.sh")" >> "$GITHUB_OUTPUT"

    # Windows and the macOS conda-forge path are the two with a download
    # large enough to be worth caching: the oclcpuexp archive is roughly
    # 110 MB, and a conda-forge PoCL environment is about 90 MB of packages
    # that unpack to 400 MB, plus a solve. Linux apt archives and macOS
    # Homebrew bottles are fast enough that caching them is not yet
    # justified.
    - name: Restore the OpenCL runtime cache
      if: runner.os == 'Windows' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}\opencl
        # version-sha256 is part of the key, not decoration. A cache hit skips
        # both the download and Assert-FileHash, so without it a second run
        # pinning the same tag with a DIFFERENT expected digest would restore
        # the first run's archive and never compare the new value -- quietly
        # breaking the "the two must agree or the run fails" guarantee.
        key: opencl-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.image-os-version }}-${{ steps.resolve.outputs.resolved-runtime }}-${{ inputs.version }}-${{ inputs.version-sha256 }}-${{ steps.resolve.outputs.script-hash }}

    # resolved-pocl-source is only ever non-empty on macOS with runtime pocl,
    # so this needs no runner.os guard of its own. The path is the same
    # literal install-macos-conda.sh builds its environment at; change one and
    # change the other.
    - name: Restore the conda-forge PoCL environment cache
      if: steps.resolve.outputs.resolved-pocl-source == 'conda-forge' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/setup-opencl-conda
        # The script hash carries both pins the environment is built from, so
        # bumping either rebuilds rather than restoring an environment made
        # from the old ones. runner.arch is in the key because osx-arm64 and
        # osx-64 packages are not interchangeable. A restored tree is still
        # not trusted on sight: install-macos-conda.sh reuses it only when the
        # stamp file it writes last matches the pins it would build from now.
        key: opencl-conda-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.image-os-version }}-${{ steps.resolve.outputs.conda-script-hash }}

    - name: Install OpenCL
      id: install
      if: runner.os != 'Windows'
      shell: bash
      env:
        SE_RUNTIME: ${{ steps.resolve.outputs.resolved-runtime }}
        SE_POCL_SOURCE: ${{ steps.resolve.outputs.resolved-pocl-source }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}" in
          Linux) script="install-linux.sh" ;;
          macOS) script="install-macos.sh" ;;
          *)
            echo "::error::No install script for runner OS '${RUNNER_OS}'"
            exit 1
            ;;
        esac
        # The install scripts also print package-manager chatter (apt-get,
        # brew) to stdout alongside their key=value contract, so only lines
        # that look like a well-formed key=value pair are safe to forward to
        # GITHUB_OUTPUT. This pattern -- rather than a fixed list of key
        # names -- is what lets a future install script add new keys without
        # them being silently dropped here.
        output="$(bash "${GITHUB_ACTION_PATH}/scripts/${script}")"
        printf '%s\n' "${output}"
        printf '%s\n' "${output}" | grep -E \
          '^[a-z][a-z0-9-]*=' \
          >> "$GITHUB_OUTPUT"

    - name: Install OpenCL (Windows)
      id: install-windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SE_RUNTIME: ${{ steps.resolve.outputs.resolved-runtime }}
        SE_VERSION: ${{ inputs.version }}
        SE_VERSION_SHA256: ${{ inputs.version-sha256 }}
        # Only used when 'version' is set, to resolve the release's asset
        # name without hitting the GitHub API's anonymous rate limit.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # The install script's stdout also carries ::error:: diagnostics and
        # remediation prose, not just its key=value contract, so only lines
        # that look like a well-formed key=value pair are safe to forward to
        # GITHUB_OUTPUT -- otherwise a diagnostic line poisons the file and
        # the runner rejects it with its own "Invalid format" error, burying
        # the real one. This mirrors the non-Windows install step's grep
        # filter. The full stream still reaches the job log via Write-Output.
        & "$env:GITHUB_ACTION_PATH\scripts\install-windows.ps1" | ForEach-Object {
          Write-Output $_
          if ($_ -match '^[a-z][a-z0-9-]*=') {
            Add-Content -Path $env:GITHUB_OUTPUT -Value $_
          }
        }
        # install-windows.ps1's own `exit 1` only ends its own scope, not
        # this wrapper's -- propagate its exit code explicitly rather than
        # relying on it leaking through the malformed-output path that this
        # step exists to close off.
        if ($LASTEXITCODE) {
          exit $LASTEXITCODE
        }

    - name: Register the vendor ICD (Windows)
      if: runner.os == 'Windows' && steps.install-windows.outputs.runtime-name != 'none'
      shell: pwsh
      env:
        SE_ICD_FILENAMES: ${{ steps.install-windows.outputs.icd-filenames }}
      run: |
        & "$env:GITHUB_ACTION_PATH\scripts\register-icd.ps1" -IcdPath "$env:SE_ICD_FILENAMES"

    # Merges the per-OS install outputs into one canonical set. This is a shell
    # step, not a ${{ a || b }} expression, because Actions' || is truthiness
    # based: 'false' and '0' are falsy, so a legitimate zero or false would be
    # discarded rather than passed through.
    - name: Collect install results
      id: collect
      shell: bash
      env:
        SE_NIX_ROOT: ${{ steps.install.outputs.opencl-root }}
        SE_WIN_ROOT: ${{ steps.install-windows.outputs.opencl-root }}
        SE_NIX_INCLUDE: ${{ steps.install.outputs.opencl-include-dir }}
        SE_WIN_INCLUDE: ${{ steps.install-windows.outputs.opencl-include-dir }}
        SE_NIX_LIBRARY: ${{ steps.install.outputs.opencl-library }}
        SE_WIN_LIBRARY: ${{ steps.install-windows.outputs.opencl-library }}
        SE_NIX_CPPFLAGS: ${{ steps.install.outputs.opencl-cppflags }}
        SE_WIN_CPPFLAGS: ${{ steps.install-windows.outputs.opencl-cppflags }}
        SE_NIX_LIBS: ${{ steps.install.outputs.opencl-libs }}
        SE_WIN_LIBS: ${{ steps.install-windows.outputs.opencl-libs }}
        SE_NIX_ICD: ${{ steps.install.outputs.icd-vendors-path }}
        SE_WIN_ICD: ${{ steps.install-windows.outputs.icd-vendors-path }}
        SE_NIX_RUNTIME_NAME: ${{ steps.install.outputs.runtime-name }}
        SE_WIN_RUNTIME_NAME: ${{ steps.install-windows.outputs.runtime-name }}
      run: |
        set -euo pipefail

        # Exactly one of the two install steps ran, so the other's outputs are
        # unset. Pick by which side actually produced a runtime-name.
        if [ "${RUNNER_OS}" = "Windows" ]; then side="WIN"; else side="NIX"; fi

        # Map each short internal key to the kebab-case name the outputs:
        # block declares, so steps.collect.outputs.* uses the same names
        # every other step already reads.
        for pair in ROOT:opencl-root INCLUDE:opencl-include-dir \
                    LIBRARY:opencl-library CPPFLAGS:opencl-cppflags \
                    LIBS:opencl-libs ICD:icd-vendors-path \
                    RUNTIME_NAME:runtime-name; do
          key="${pair%%:*}"
          outname="${pair#*:}"
          var="SE_${side}_${key}"
          printf '%s=%s\n' "${outname}" "${!var-}"
        done >> "$GITHUB_OUTPUT"

    - name: Export the OpenCL environment
      shell: bash
      env:
        SE_CPPFLAGS: ${{ steps.collect.outputs.opencl-cppflags }}
        SE_LIBS: ${{ steps.collect.outputs.opencl-libs }}
        SE_ROOT: ${{ steps.collect.outputs.opencl-root }}
        SE_LIBRARY: ${{ steps.collect.outputs.opencl-library }}
        SE_INCLUDE_DIR: ${{ steps.collect.outputs.opencl-include-dir }}
        SE_ICD_VENDORS: ${{ steps.collect.outputs.icd-vendors-path }}
        SE_SDKROOT: ${{ steps.install.outputs.sdkroot }}
        SE_ICD_FILENAMES: ${{ steps.install-windows.outputs.icd-filenames }}
        SE_LOADER_BIN_DIR: ${{ steps.install-windows.outputs.loader-bin-dir }}
      run: |
        set -euo pipefail

        # Idempotent: a caller's explicit setting always wins. A skip here is
        # silent otherwise -- a stale value inherited from an earlier step
        # (e.g. an old OPENCL_LIBS left behind by a previous job) would then
        # steer this job's build with no trace of why. Name the variable so
        # that trail exists.
        set_env() {
          if [ -z "${!1+set}" ]; then
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"
          else
            echo "::notice::${1} is already set; keeping the caller's existing value instead of exporting the action's"
          fi
        }

        # OCL_ICD_FILENAMES is a Khronos-loader variable and is consulted
        # before the registry. On Linux it does nothing -- ocl-icd added it
        # only in 2.3.5, and no Ubuntu release through 26.04 ships that.
        if [ "${RUNNER_OS}" = "Windows" ] && [ -n "${SE_ICD_FILENAMES:-}" ]; then
          set_env OCL_ICD_FILENAMES "${SE_ICD_FILENAMES}"
        fi

        # Exactly one loader directory on PATH. GITHUB_PATH prepends, so
        # adding a second would silently shadow the one the build linked
        # against.
        if [ -n "${SE_LOADER_BIN_DIR:-}" ]; then
          printf '%s\n' "${SE_LOADER_BIN_DIR}" >> "$GITHUB_PATH"
        fi

        # Every install script is responsible for handing back cppflags that
        # already resolve <CL/cl.h> on its own platform (see
        # scripts/install-macos.sh for the Apple-framework special case), so
        # this step stays runtime-agnostic.
        set_env OPENCL_CPPFLAGS   "${SE_CPPFLAGS}"
        set_env OPENCL_LIBS       "${SE_LIBS}"
        set_env OpenCL_ROOT       "${SE_ROOT}"
        set_env OpenCL_LIBRARY    "${SE_LIBRARY}"
        set_env OpenCL_INCLUDE_DIR "${SE_INCLUDE_DIR}"

        if [ "${RUNNER_OS}" != "Windows" ] && [ -n "${SE_ICD_VENDORS}" ]; then
          set_env OCL_ICD_VENDORS "${SE_ICD_VENDORS}"
        fi

        # PoCL's LLVM cannot find system headers without SDKROOT.
        if [ -n "${SE_SDKROOT:-}" ]; then
          set_env SDKROOT "${SE_SDKROOT}"
        fi

    - name: Probe for an OpenCL device (Windows)
      id: verify-windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SE_RESOLVED: ${{ steps.resolve.outputs.resolved-runtime }}
        SE_VERIFY: ${{ inputs.verify }}
        SE_REQUIRE_FP64: ${{ inputs.require-fp64 }}
        SE_REQUIRE_KERNEL: ${{ inputs.require-kernel }}
        SE_LOADER_BIN_DIR: ${{ steps.install-windows.outputs.loader-bin-dir }}
        # Read from the collect step's outputs rather than the OPENCL_CPPFLAGS
        # / OPENCL_LIBS the export step just published: a caller who pre-set
        # those keeps their own values (set_env's caller-wins rule), and the
        # kernel round trip must be built against the SDK this action actually
        # installed, not against whatever a caller pointed those at.
        SE_CPPFLAGS: ${{ steps.collect.outputs.opencl-cppflags }}
        SE_LIBS: ${{ steps.collect.outputs.opencl-libs }}
      run: |
        $ErrorActionPreference = 'Stop'
        $clinfo = Join-Path $env:SE_LOADER_BIN_DIR 'clinfo.exe'

        # clinfo's exit code is unusable: main() tolerates
        # CL_PLATFORM_NOT_FOUND_KHR and unconditionally returns 0. Gate on
        # content, never on status.
        #
        # stderr is merged in deliberately -- a vendor DLL that fails to load
        # is exactly the kind of thing worth surfacing here -- but under
        # $ErrorActionPreference = 'Stop', merging a native command's stderr
        # via 2>&1 can itself raise a terminating NativeCommandError. Relax
        # the preference only around this one call so stderr is captured as
        # content, never treated as fatal.
        $previousEap = $ErrorActionPreference
        $ErrorActionPreference = 'Continue'
        try {
          $raw = & $clinfo --raw 2>&1 | Out-String
        } finally {
          $ErrorActionPreference = $previousEap
        }

        $names = [regex]::Matches($raw, 'CL_DEVICE_NAME\s+(.+)')
        $count = $names.Count
        $name  = if ($count -gt 0) { $names[0].Groups[1].Value.Trim() } else { '' }
        $ver   = [regex]::Match($raw, 'CL_PLATFORM_VERSION\s+(.+)')
        $fp64m = [regex]::Match($raw, 'CL_DEVICE_DOUBLE_FP_CONFIG\s+(.+)')
        $fp64  = if ($fp64m.Success -and $fp64m.Groups[1].Value.Trim() -notmatch '^(0|None)$') { 'true' } else { 'false' }

        "device-count=$count"                                            | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
        "device-name=$name"                                              | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
        "platform-version=$(if ($ver.Success) { $ver.Groups[1].Value.Trim() })" | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
        "fp64=$fp64"                                                     | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append

        # clinfo reports what a device claims. It cannot report whether the
        # device works, and it never could: on a windows-2025 runner whose
        # Intel oclcpuexp runtime died with 0xC0000005 inside
        # common_clang64.dll on every single kernel build, every line clinfo
        # printed above was accurate and healthy-looking. So the four keys
        # above still come from clinfo -- unchanged, byte for byte what v1
        # consumers already read -- and 'kernel' comes from the same
        # scripts/probe.c the POSIX path uses, compiled here against the SDK
        # this action just installed and run as its own process.
        #
        # That needs a C compiler, which this path has never needed before.
        # GitHub's windows-* images ship mingw gcc on PATH (the sibling
        # setup-clblast action compiles its GEMM verifier with it on every
        # Windows run), but a self-hosted or container runner may not have
        # one. Losing the four enumeration keys over a dependency added for a
        # fifth would be a regression for every existing consumer, so a
        # missing compiler costs this key alone and says so out loud.
        $kernel = 'false'
        $kernelReason = ''

        $compiler = $null
        foreach ($candidate in @('gcc', 'clang', 'cc')) {
          if (Get-Command $candidate -ErrorAction SilentlyContinue) { $compiler = $candidate; break }
        }

        if (-not $compiler) {
          $kernelReason = "no C compiler ('gcc', 'clang' or 'cc') was found on PATH, so the kernel round trip could not be built"
        } else {
          $probeDir = Join-Path $env:RUNNER_TEMP 'setup-opencl-probe'
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $probeExe = Join-Path $probeDir 'probe.exe'
          $probeSrc = Join-Path $env:GITHUB_ACTION_PATH 'scripts\probe.c'

          # Each of these arrives as one string holding one or more flags
          # ("-I<dir>", "-L<dir> -lOpenCL"); PowerShell would pass an
          # unsplit string as a single argument and gcc would reject it.
          # Order matters: the library flags follow the source file, which
          # is what GNU ld requires to resolve symbols out of OpenCL.lib.
          $flags = @()
          foreach ($group in @($env:SE_CPPFLAGS, $env:SE_LIBS)) {
            if ($group) {
              $flags += $group.Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
            }
          }

          # Same reasoning as the clinfo call above: a native command's
          # stderr merged with 2>&1 can raise a terminating NativeCommandError
          # under 'Stop', and neither a compiler diagnostic nor a crashing
          # probe is a reason to fail this step. Both are results to report.
          $previousEap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            $buildLog = & $compiler -o $probeExe $probeSrc @flags 2>&1 | Out-String
            $buildStatus = $LASTEXITCODE
            if ($buildStatus -ne 0) {
              Write-Output $buildLog
              $kernelReason = "probe.c did not compile with '$compiler' (exit $buildStatus)"
            } else {
              # Run out of process with its streams on disk, rather than as
              # a pipeline, for two reasons. First, a broken runtime can hang
              # in the build instead of failing it, and nothing else here
              # bounds that -- probe.c caps it with alarm() on POSIX, but
              # Windows has no fork for it to isolate into, and this is the
              # platform whose runtime is the one known to misbehave. A job
              # that hangs spends its whole time budget to report nothing.
              # Second, separate streams keep the build log (stderr) out of
              # the key=value text being parsed (stdout).
              $outFile = Join-Path $probeDir 'probe.out'
              $errFile = Join-Path $probeDir 'probe.err'
              $proc = Start-Process -FilePath $probeExe -NoNewWindow -PassThru `
                        -RedirectStandardOutput $outFile -RedirectStandardError $errFile
              $timedOut = -not $proc.WaitForExit(120000)
              if ($timedOut) {
                $proc.Kill()
                $proc.WaitForExit()
              }
              $probeStatus = $proc.ExitCode

              $probeOut = if (Test-Path $outFile) { (Get-Content -Raw $outFile) } else { '' }
              $probeErr = if (Test-Path $errFile) { (Get-Content -Raw $errFile) } else { '' }
              Write-Output "Kernel round-trip probe output (its own enumeration keys are informational here; the four keys above come from clinfo):"
              if ($probeOut) { Write-Output $probeOut }
              if ($probeErr) { Write-Output $probeErr }

              # probe.c prints and flushes its four enumeration keys before it
              # touches the round trip, so a runtime that crashes the process
              # kills it after those and before this line -- which is the
              # exact failure being measured. A missing line is therefore read
              # as false, never left unset and never allowed to fail the step.
              $kernelMatch = [regex]::Match([string]$probeOut, '(?m)^kernel=(true|false)\s*$')
              if ($timedOut) {
                $kernelReason = "the probe was still running after 120 seconds and was killed, so the runtime hung rather than failing"
              } elseif ($kernelMatch.Success) {
                $kernel = $kernelMatch.Groups[1].Value
              } else {
                $kernelReason = "the probe exited $probeStatus without reporting a 'kernel' result, which is what a runtime that crashes the process looks like"
              }
            }
          } finally {
            $ErrorActionPreference = $previousEap
          }
        }

        "kernel=$kernel" | Tee-Object -FilePath $env:GITHUB_OUTPUT -Append

        if ($kernelReason) {
          Write-Output "::warning::Could not measure whether the device can run a kernel: $kernelReason. Reporting kernel=false."
        }

        # "A device exists but cannot run anything" is precisely the state
        # that shipped undetected, so this warning is unconditional: ahead of
        # the 'runtime: none' exit below and independent of require-kernel.
        # Whatever the inputs say, this combination must never be silent.
        #
        # $kernelReason means the round trip never ran -- no compiler, or
        # probe.c would not build. That is reported above, and claiming here
        # that the device "did not produce the expected result" would be a
        # statement about something that never happened, on exactly the
        # runners this code goes out of its way to tolerate.
        if ($count -gt 0 -and -not $kernelReason -and $kernel -ne 'true') {
          Write-Output "::warning::Found $count OpenCL device(s), but the first one could not run a trivial kernel: the round trip (build, launch, read back, compare the numbers) did not produce the expected result. Code will compile and link against OpenCL on this runner; nothing will execute. The probe's stderr above carries the build log, if the runtime produced one."
        }

        if ($env:SE_RESOLVED -eq 'none') {
          Write-Output "::notice::Installed headers and loader only; $count device(s) found"
          exit 0
        }
        if ($env:SE_VERIFY -eq 'true' -and $count -eq 0) {
          Write-Output "::error::No OpenCL device found on this runner"
          Write-Output "Set 'runtime' to a specific value, or set 'verify' to 'false' if a device is not required."
          exit 1
        }
        # A zero device count means there is nothing to check fp64 support
        # on, and that is a distinct condition from "found a device that
        # lacks it" -- do not let an explicit 'verify: false' (the correct
        # caller response to a runtime with no device) get overridden by this
        # gate finding a precision problem that was never actually observed.
        # Matches the POSIX probe step's guard exactly.
        if ($count -gt 0 -and $env:SE_REQUIRE_FP64 -eq 'true' -and $fp64 -ne 'true') {
          Write-Output "::error::The OpenCL device does not support double precision"
          Write-Output "Set 'require-fp64' to 'false' if single precision is sufficient."
          exit 1
        }

        # Guarded on the device count for the same reason as the fp64 gate
        # above: with no device there is nothing to run a kernel on, and a
        # caller who set 'verify: false' because this runner has no device
        # should not then be failed for the consequence of that.
        if ($count -gt 0 -and $env:SE_REQUIRE_KERNEL -eq 'true' -and $kernel -ne 'true') {
          if ($kernelReason) {
            Write-Output "::error::Could not measure whether the OpenCL device can run a kernel, and 'require-kernel' is true: $kernelReason"
            Write-Output "This is not a verdict on the device -- the round trip never ran. Install a C compiler on this runner, or set 'require-kernel' to 'false'."
          } else {
            Write-Output "::error::The OpenCL device cannot run a kernel"
            Write-Output "Set 'require-kernel' to 'false' to reduce this to a warning, or pin a runtime version whose kernel compiler works on this runner (see the 'version' input)."
          }
          exit 1
        }

    - name: Probe for an OpenCL device
      id: verify
      if: runner.os != 'Windows'
      shell: bash
      env:
        SE_RESOLVED: ${{ steps.resolve.outputs.resolved-runtime }}
        SE_VERIFY: ${{ inputs.verify }}
        SE_REQUIRE_FP64: ${{ inputs.require-fp64 }}
        SE_REQUIRE_KERNEL: ${{ inputs.require-kernel }}
      run: |
        set -euo pipefail

        # The 'cc' availability check now lives in the resolve step, the
        # first step of this composite, so a container without a compiler
        # fails in seconds instead of paying for a full apt-get install of
        # PoCL and LLVM first. cc is therefore already known to exist here.
        probe_dir="$(mktemp -d)"
        # shellcheck disable=SC2086
        cc -o "${probe_dir}/probe" "${GITHUB_ACTION_PATH}/scripts/probe.c" \
           ${OPENCL_CPPFLAGS} ${OPENCL_LIBS}

        # The probe's contract is to exit 0 whatever it finds, and it goes to
        # some length to keep that true on a runtime that crashes: the kernel
        # round trip runs in a re-executed child, so the process printing the
        # keys survives a segfault in the runtime's compiler. A non-zero
        # status here therefore means the probe process itself died, which is
        # still reachable when that isolation could not be set up. Capture the
        # status instead of letting `set -e` kill the step on it: the probe
        # flushes its four enumeration keys before it attempts anything risky,
        # so its output is still worth reading, and reporting "this device
        # cannot run a kernel" beats a step that dies with no message at all.
        set +e
        output="$("${probe_dir}/probe")"
        probe_status=$?
        set -e
        printf '%s\n' "${output}"

        if [ "${probe_status}" -ne 0 ]; then
          echo "::warning::The OpenCL probe exited ${probe_status} instead of its contractual 0, so it was killed rather than returning. Anything it had not printed by then is reported below as a failure."
        fi

        count="$(printf '%s\n' "${output}" | sed -n 's/^device-count=//p')"
        fp64="$(printf '%s\n' "${output}" | sed -n 's/^fp64=//p')"
        kernel="$(printf '%s\n' "${output}" | sed -n 's/^kernel=//p')"

        # `[ "${count}" -eq 0 ]` returns 2 (not 1) on non-numeric input, which
        # inside an `&&` chain in an `if` just makes the condition false --
        # this gate is the action's entire safety story, so fail closed
        # instead of silently passing on a malformed probe result. This runs
        # before the GITHUB_OUTPUT filter below on purpose: under
        # `set -euo pipefail`, a `grep` that matches nothing exits 1 and
        # would otherwise kill the step with no message at all, burying this
        # diagnostic instead of firing it.
        case "${count}" in
          ''|*[!0-9]*)
            echo "::error::Probe produced a non-numeric device-count '${count}'"
            exit 1
            ;;
        esac

        # Missing or malformed only when the probe died partway through its
        # own output. The four enumeration keys are printed and flushed as
        # one uninterrupted block before the round trip begins, so a numeric
        # device-count above implies all four arrived and 'kernel' is the
        # only key a crash can still eat. "Not measured" is not "measured
        # working", so it fails closed to false and says why.
        # kernel_measured records whether the round trip actually ran, which
        # is not the same question as whether it succeeded. Only a real
        # measurement may be reported as a verdict on the device.
        kernel_measured=1
        case "${kernel}" in
          true|false) ;;
          *)
            echo "::warning::The OpenCL probe reported no usable 'kernel' result ('${kernel}'); treating it as false"
            kernel="false"
            kernel_measured=0
            ;;
        esac

        # probe.c is fully controlled by this action, so its stdout is safe
        # today, but this is the same key=value-only contract the other
        # three GITHUB_OUTPUT write sites already enforce (see "Install
        # OpenCL" above and the Windows install/probe steps) -- apply it
        # here too rather than being the one site that assumes well-formed
        # output forever. Full stdout still reaches the job log via the
        # printf above. Safe from the pipefail-kills-the-step trap now that
        # it runs after the count check above: a well-formed count implies a
        # 'device-count=...' line was present, so grep is guaranteed at
        # least one match.
        #
        # 'kernel' is filtered out of that copy and written from the shell
        # variable instead, so the value consumers read is the normalized one
        # above -- a probe that was killed before printing it must still
        # produce the key, not leave the output unset.
        printf '%s\n' "${output}" | grep -E \
          '^[a-z][a-z0-9-]*=' \
          | grep -v '^kernel=' \
          >> "$GITHUB_OUTPUT"
        printf 'kernel=%s\n' "${kernel}" >> "$GITHUB_OUTPUT"

        # "A device exists but cannot run anything" is precisely the state
        # that shipped undetected, so this warning is unconditional: ahead of
        # the 'runtime: none' exit below and independent of require-kernel.
        # Whatever the inputs say, this combination must never be silent.
        #
        # Gated on kernel_measured: when the probe died before reporting, the
        # round trip never ran, and saying the device "did not produce the
        # expected result" would be a claim about something that never
        # happened. That case is already reported by the warning above.
        if [ "${count}" -gt 0 ] && [ "${kernel_measured}" -eq 1 ] && [ "${kernel}" != "true" ]; then
          echo "::warning::Found ${count} OpenCL device(s), but the first one could not run a trivial kernel: the round trip (build, launch, read back, compare the numbers) did not produce the expected result. Code will compile and link against OpenCL on this runner; nothing will execute. The probe's stderr above carries the build log, if the runtime produced one."
        fi

        # Requesting a headers-only install and then failing for having no
        # device would be self-contradictory, so verification is never fatal
        # when runtime is "none".
        if [ "${SE_RESOLVED}" = "none" ]; then
          echo "::notice::Installed headers and loader only; ${count} device(s) found"
          exit 0
        fi

        if [ "${SE_VERIFY}" = "true" ] && [ "${count}" -eq 0 ]; then
          echo "::error::No OpenCL device found on this runner"
          echo "Set 'runtime' to a specific value, or set 'verify' to 'false' if a device is not required."
          exit 1
        fi

        # A zero device count means there is nothing to check fp64 support
        # on, and that is a distinct condition from "found a device that
        # lacks it" -- do not let an explicit 'verify: false' (the correct
        # caller response to a runtime with no device) get overridden by this
        # gate finding a precision problem that was never actually observed.
        if [ "${count}" -gt 0 ] && [ "${SE_REQUIRE_FP64}" = "true" ] && [ "${fp64}" != "true" ]; then
          echo "::error::The OpenCL device does not support double precision"
          echo "Set 'require-fp64' to 'false' if single precision is sufficient."
          exit 1
        fi

        # Guarded on the device count for the same reason as the fp64 gate
        # above: with no device there is nothing to run a kernel on, and a
        # caller who set 'verify: false' because this runner has no device
        # should not then be failed for the consequence of that.
        if [ "${count}" -gt 0 ] && [ "${SE_REQUIRE_KERNEL}" = "true" ] && [ "${kernel}" != "true" ]; then
          if [ "${kernel_measured}" -eq 0 ]; then
            echo "::error::Could not measure whether the OpenCL device can run a kernel, and 'require-kernel' is true"
            echo "This is not a verdict on the device -- the round trip never reported. Set 'require-kernel' to 'false', or investigate the probe warning above."
            exit 1
          fi
          echo "::error::The OpenCL device cannot run a kernel"
          echo "Set 'require-kernel' to 'false' to reduce this to a warning, or pin a runtime version whose kernel compiler works on this runner (see the 'version' input)."
          exit 1
        fi

    # Merges the two probe outputs the same way the install outputs are
    # merged: a shell step, never `||`. device-count is legitimately 0 on
    # every headers-only run and fp64 and kernel are legitimately false, and
    # all three are falsy to Actions' `||`, so a coalescing expression would
    # blank out exactly the values the `runtime: none` legs exist to assert
    # -- and would turn the one output that reports a broken device into an
    # empty string precisely when it has something to say.
    - name: Collect probe results
      id: probe
      shell: bash
      env:
        SE_NIX_COUNT: ${{ steps.verify.outputs.device-count }}
        SE_WIN_COUNT: ${{ steps.verify-windows.outputs.device-count }}
        SE_NIX_NAME: ${{ steps.verify.outputs.device-name }}
        SE_WIN_NAME: ${{ steps.verify-windows.outputs.device-name }}
        SE_NIX_PLATFORM: ${{ steps.verify.outputs.platform-version }}
        SE_WIN_PLATFORM: ${{ steps.verify-windows.outputs.platform-version }}
        SE_NIX_FP64: ${{ steps.verify.outputs.fp64 }}
        SE_WIN_FP64: ${{ steps.verify-windows.outputs.fp64 }}
        SE_NIX_KERNEL: ${{ steps.verify.outputs.kernel }}
        SE_WIN_KERNEL: ${{ steps.verify-windows.outputs.kernel }}
      run: |
        set -euo pipefail
        if [ "${RUNNER_OS}" = "Windows" ]; then side="WIN"; else side="NIX"; fi

        # Indirect expansion (${!var-}), same idiom as "Collect install
        # results" -- easier to audit than eval, and identically preserves a
        # legitimate 0/false from a genuinely unset variable.
        for pair in COUNT:device-count NAME:device-name \
                    PLATFORM:platform-version FP64:fp64 KERNEL:kernel; do
          key="${pair%%:*}"
          outname="${pair#*:}"
          var="SE_${side}_${key}"
          printf '%s=%s\n' "${outname}" "${!var-}"
        done >> "$GITHUB_OUTPUT"
